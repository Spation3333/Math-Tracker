<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathTrack - Sign Up</title>
    <link rel="icon" type="image/jpeg" href="Images/logo.jpg">
    <link href="styles.css" rel="stylesheet" />
    <link href="darkmode.css" rel="stylesheet" />
    <style>
        select,
        textarea {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

    </style>
</head>

<body>
    <div class="themewrapper" style="position: absolute; top: 20px; right: 20px;">
        <label class="switch"><input type="checkbox" id="theme-toggle"><span class="slider round"></span></label>
    </div>

    <div class="signupportal">
        <h1 class="welcomeheader" style="margin-bottom: 10px; font-size: 40px;">Create Account</h1>
        <p style="margin-bottom: 30px; opacity: 0.8;">Join the MathTrack Portal</p>

        <div class="doubleinput">
            <div class="signupinput" style="flex: 1;"><label>First Name</label><input type="text" id="firstName"
                    placeholder="e.g. Jane"></div>
            <div class="signupinput" style="flex: 1;"><label>Last Name</label><input type="text" id="lastName"
                    placeholder="e.g. Doe"></div>
        </div>

        <div class="signupinput"><label>Email Address (Username)</label><input type="email" id="email"
                placeholder="teacher@school.com"></div>

        <div class="signupinput" style="position: relative;">
            <label>Gmail App Password</label>
            <input type="password" id="appPassword" placeholder="16-letter password" style="padding-right: 35px;">
            <span id="toggleAppPass"
                style="position: absolute; right: 10px; top: 35px; cursor: pointer; font-size: 18px;">👁️</span>
        </div>

        <div class="doubleinput">
            <div class="signupinput" style="flex: 1; position: relative;">
                <label>4-Digit PIN</label><input type="password" id="pin" placeholder="1234" maxlength="4"
                    style="padding-right: 35px;">
                <span id="togglePin"
                    style="position: absolute; right: 10px; top: 35px; cursor: pointer; font-size: 18px;">👁️</span>
            </div>
            <div class="signupinput" style="flex: 1; position: relative;">
                <label>Confirm PIN</label><input type="password" id="confPin" placeholder="1234" maxlength="4"
                    style="padding-right: 35px;">
                <span id="toggleConfPin"
                    style="position: absolute; right: 10px; top: 35px; cursor: pointer; font-size: 18px;">👁️</span>
            </div>
        </div>

        <div class="rulebox" id="rulesBox">
            <div id="rule-length" class="rule">❌ Must be exactly 4 characters</div>
            <div id="rule-number" class="rule">❌ Must contain only numbers</div>
            <div id="rule-match" class="rule">❌ PINs must match</div>
        </div>

        <button class="buttons largebuttons" id="signupBtn" onclick="createAccount()" disabled style="opacity: 0.5;">Create
            Account & Login</button>
        <a href="index.html"
            style="display: block; margin-top: 20px; color: rgb(139, 107, 35); font-weight: bold; text-decoration: none;">←
            Back to Login</a>
    </div>

    <script src="signupScript.js"></script>
</body>

</html>
