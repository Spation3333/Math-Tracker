<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathTrack - Class Gradebook</title>
    <link rel="icon" type="image/jpeg" href="Images/logo.jpg">
    <link href="studentStyles.css" rel="stylesheet" />
    <style>
        .profile-widget {
            position: absolute;
            top: 15px;
            left: 20px;
            cursor: pointer;
            background: var(--card-bg, #fff);
            padding: 10px 15px;
            border-radius: 8px;
            border: 2px solid var(--border-color);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            z-index: 100;
            text-align: left;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modalcontent {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 10px;
            border: 3px solid rgb(139, 107, 35);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .signupinput {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .signupinput label {
            font-weight: bold;
            width: 140px;
            text-align: left;
        }

        .signupinput input {
            flex: 1;
            padding: 8px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background: var(--input-bg);
            color: var(--text-color);
        }
    </style>
</head>

<body>

    <div class="profile-widget" onclick="openProfileModal()">
        <div id="profile-name" style="font-weight: bold; font-size: 1.1em; color: var(--accent);"></div>
        <div id="profile-email" style="font-size: 0.85em; color: gray;"></div>
    </div>

    <p id="currentdate" class="date-display" style="position: absolute; top: 80px; left: 20px;"></p>

    <div class="container" style="margin-top: 50px;">
        <div class="header-bar">
            <h1 style="margin: 0;">MathTrack Progress</h1>
            <div style="display: flex; align-items: center; gap: 10px;">
                <span style="font-size: 0.9em; font-weight: bold;">Dark Mode</span>
                <label class="switch"><input type="checkbox" id="theme-toggle"><span
                        class="slider round"></span></label>
            </div>
        </div>

        <a href="select.html" class="nav-link">← Back to Classes</a>
        <div id="class-nav-bar" class="class-nav-bar"></div>

        <div class="controls">
            <h2 style="margin: 0;">Viewing: <span id="current-class-label"
                    style="color: var(--accent);">Loading...</span></h2>

            <div style="display: flex; flex-direction: column; gap: 10px; min-width: 250px;">
                <button class="btn btn-success" style="width: 100%;" onclick="emailAllStudents()">📧 Email Grades
                    (Current Unit)</button>
                <button class="btn btn-danger" style="width: 100%;" onclick="deleteClassRoster()">🗑️ Delete Entire
                    Roster</button>
                <span id="emailStatus" style="text-align: center;"></span>
            </div>
        </div>

        <div class="import-section" id="import-box">
            <p style="margin-top: 0;"><strong>Import Roster (.csv)</strong></p>
            <input type="file" id="csv-file" accept=".csv" style="margin-bottom: 10px;">
            <button class="btn" style="background: var(--primary);" onclick="handleCSV()">Upload & Process</button>
        </div>

        <div class="units-section">
            <h3 style="margin-top: 0; margin-bottom: 15px; font-size: 1.3em;">1. Select Unit to Grade</h3>
            <div id="units-container" class="unit-container"></div>
        </div>

        <h3 style="margin-top: 0; margin-bottom: 10px; font-size: 1.3em;">2. Class Gradebook</h3>
        <div id="roster-container" class="table-responsive"></div>
    </div>

    <div id="profile-modal" class="modal">
        <div class="modalcontent" style="max-width: 450px; width: 100%;">
            <h2 style="margin-top:0;">Edit Profile</h2>
            <div class="signupinput"><label>First Name:</label><input type="text" id="prof-fname"></div>
            <div class="signupinput"><label>Last Name:</label><input type="text" id="prof-lname"></div>
            <div class="signupinput"><label>Username:</label><input type="email" id="prof-email"></div>
            <div class="signupinput"><label>App Password:</label><input type="password" id="prof-apppass"></div>

            <hr style="width:100%; border: 0; border-top: 1px solid var(--border-color, #ccc); margin: 20px 0;">

            <div class="signupinput">
                <label style="color:var(--danger, red);">Confirm PIN:</label>
                <input type="password" id="prof-pin" maxlength="4" placeholder="To save changes">
            </div>

            <div style="margin-top: 20px; display: flex; justify-content: center; gap: 15px;">
                <button class="btn btn-primary" onclick="saveProfile()">Change</button>
                <button class="btn btn-danger cancelbutton" onclick="closeProfileModal()">Cancel</button>
            </div>
        </div>
    </div>

    <script src="studentScript.js"></script>

</body>

</html>
