<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathTrack - Portal</title>
    <link rel="icon" type="image/jpeg" href="Images/logo.jpg">
    <link href="styles.css" rel="stylesheet" />
    <style>
        .portal-container {
            max-width: 450px;
            margin: 60px auto;
            text-align: center;
            background-color: var(--card-bg, #fff);
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        /* Custom spacing to pull H1 and H2 closer together */
        .welcomeheader {
            margin-bottom: 0px; 
            font-size: 50px;
        }
        .subtitle {
            margin-top: 5px; 
            font-size: 45px;
        }
    </style>
</head>

<body>

    <div class="themewrapper" style="position: absolute; top: 20px; right: 20px;">
        <label class="switch">
            <input type="checkbox" id="theme-toggle">
            <span class="slider round"></span>
        </label>
    </div>

    <div class="portal-container">
        <h1 class="welcomeheader">MathTrack</h1>
        <h2 class="subtitle" style="margin-bottom: 30px;">Teacher Portal</h2>

        <div style="display: flex; flex-direction: column; align-items: stretch; max-width: 300px; margin: 0 auto 30px auto;">
            <div class="signupinput" style="text-align: left; margin-bottom: 10px;">
                <label for="loginPin">4-Digit PIN:</label>
                <div class="passwordwrapper" style="position: relative;">
                    <input type="password" id="loginPin" placeholder="e.g. 1234" maxlength="4" autocomplete="current-password" style="width: 100%; box-sizing: border-box; padding-right: 30px;">
                    <button type="button" class="eye-icon" onclick="togglePassword()" style="position: absolute; right: 5px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; padding: 0;">👁️</button>
                </div>
            </div>

            <div class="linkrow" style="display: flex; justify-content: space-between; align-items: center;">
                <a href="recovery.html" class="forgotlink" style="font-size: 0.9em;">Forgot PIN?</a>
                <button class="buttons" onclick="window.location.href='signup.html'" style="margin: 0; padding: 6px 12px; font-size: 0.9em;">Create Account</button>
            </div>
        </div>

        <hr style="border: 0; border-top: 1px solid var(--border-color, #ccc); margin-bottom: 10px; margin-top: 0px;">

        <div class="mainbuttonsrow">
            <button class="buttons mainbuttons" onclick="window.location.href='credits.html'">Credits</button>
            <button class="buttons cancelbutton mainbuttons" onclick="quitApp()">Quit</button>
        </div>
    </div>

    <script>
        const themeToggle = document.getElementById('theme-toggle');
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('darkmode');
            themeToggle.checked = true;
        }
        themeToggle.addEventListener('change', () => {
            document.body.classList.toggle('darkmode');
            localStorage.setItem('theme', document.body.classList.contains('darkmode') ? 'dark' : 'light');
        });

        function togglePassword() {
            const pinInput = document.getElementById('loginPin');
            const eyeIcon = pinInput.nextElementSibling;
            if (pinInput.type === "password") {
                pinInput.type = "text";
                eyeIcon.textContent = "🔒";
            } else {
                pinInput.type = "password";
                eyeIcon.textContent = "👁️";
            }
        }

        const pinField = document.getElementById('loginPin');

        pinField.addEventListener('input', function () {
            this.value = this.value.replace(/[^0-9]/g, '');

            if (this.value.length === 4) {
                const users = JSON.parse(localStorage.getItem('mathTrackUsers')) || {};
                let account = null;

                // Find user by PIN only
                for (let email in users) {
                    if (users[email].pin === this.value) {
                        account = users[email];
                        break;
                    }
                }

                if (account) {
                    localStorage.setItem('currentUser', JSON.stringify(account));
                    document.body.style.opacity = '0.5';
                    document.body.style.transition = 'opacity 0.2s ease';
                    setTimeout(() => { window.location.href = "select.html"; }, 250);
                } else {
                    alert("Incorrect PIN.");
                    this.value = "";
                }
            }
        });

        function quitApp() { 
            if (confirm("Close MathTrack Portal?")) {
                window.close();
                document.body.innerHTML = "<h1 style='text-align:center; margin-top:50px;'>You may now close this tab.</h1>";
            }
        }
    </script>
</body>

</html>
