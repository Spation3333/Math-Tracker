<!DOCTYPE html>
<html lang="en">


<head> <!-- Start of Head -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In</title> <!-- Title -->
    <link href="styles.css" rel="stylesheet" /> <!-- Links to CSS file -->
</head> <!-- End of Head -->


<body> <!-- Start of Body -->


    <p id="currentdate" class="datedisplay"></p>


    <h2 class="loginheader"> Log In </h2> <!-- Displays Title -->


    <div class="loginform"> <!-- Start of Login Form -->


        <div class="logininput"> <!-- Start of Username -->
            <label for="user">Username: </label> <!-- Displays Label -->
            <input type="text" id="user" name="user"> <!-- Displays Textbox -->
        </div> <!-- End of Username -->


        <div class="logininput"> <!-- Start of Password -->
            <label for="pass">Password: </label> <!-- Displays Label -->
            <input type="password" id="pass" name="pass"> <!-- Displays Textbox -->
            <button type="button" class="togglebuttons" onclick="togglePassword('pass')">👁️</button>
            <!-- Show Password Button -->
        </div> <!-- End of Password -->


        <div class="logininput bottom-row">
            <div class="label-spacer"></div>
            <a href="recovery.html">Forgot Password?</a> <!-- Forgot Password Link -->
            <a href="select.html" class="buttons">Log in</a> <!-- Login Button -->
        </div>


    </div> <!-- End of Login Form -->


    <a href="index.html" class="buttons backbuttons"> back </a> <!-- Back Button -->


    <div class="themewrapper"> <!-- Start of Theme Switch Bar -->
        <label class="switch"> <!-- Creates Switch -->
            <input type="checkbox" id="theme-toggle"> <!-- Makes it an Input -->
            <span class="slider round"></span> <!-- Makes Switch into Circle -->
        </label> <!-- End of Switch -->
    </div> <!-- End of Theme Switch Bar -->


    <script src="script.js"></script> <!-- Links to JS File -->


</body> <!-- End of Body -->


</html> <!-- End of HTML -->
