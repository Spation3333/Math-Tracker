<!DOCTYPE html> <!-- Start of HTML -->
<html lang="en"> <!-- Primary Language is English -->

<head> <!-- Start of Head -->
    <meta charset="UTF-8"> <!-- Tells What Characters to Use -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Matches Screen Width -->
    <title>MathTrack - Recovery</title> <!-- Title of Page -->
    <link rel="icon" type="image/png" href="Images/logo.png"> <!-- Favicon -->
    <link href="styles.css" rel="stylesheet" /> <!-- Links to styles.css file -->
    <link href="darkmode.css" rel="stylesheet" /> <!-- Links to darkmode.css file -->
</head> <!-- End of Head -->

<body> <!-- Start of Body -->

    <div class="themewrapper" style="position: absolute; top: 20px; right: 20px;"> <!-- Start of Location for Darkmode Toggle -->
        <span class="darkmode-label">Dark Mode</span> <!-- Darkmode Label -->
        <label class="switch"> <!-- Start of Darkmode Toggle -->
            <input type="checkbox" id="theme-toggle"> <!-- Creates Toffle -->
            <span class="slider round"></span> <!-- Makes it Circle Toggle -->
        </label> <!-- End of Darkmode Toggle -->
    </div> <!-- End of Location for Darkmode Toggle -->

    <div class="recoveryportal"> <!-- Start of Portal for recovery.html -->

        <h1 class="welcomeheader" style="margin-bottom: 10px; font-size: 40px;">Recover PIN</h1> <!-- Main Title -->
        <p style="margin-bottom: 30px; opacity: 0.8;" id="instructionText">Enter your email to receive a recovery code.</p> <!-- Subtitle -->

        <div id="step1"> <!-- Start of Step 1 Where you Input Email Address -->
            <div class="signupinput"> <!-- Start of Email Input -->
                <label>Email Address</label> <!-- Label for Email Input -->
                <input type="email" id="email" placeholder="teacher@school.com"> <!-- Textbox for Email Input -->
            </div> <!-- End of Email Input -->
            <button class="buttons largebuttons" id="sendBtn" onclick="sendCode()">Send Recovery Code</button> <!-- Send Recovery Code -->
        </div> <!-- End of Step 1 Where you Input Email Address -->

        <div id="step2" style="display: none;"> <!-- Start of Step 2 Where you Create New Password -->

            <div class="signupinput" style="margin-bottom: 30px;"> <!-- Start of Recovery Code Input -->
                <label style="color: var(--accent, #3498db);">4-Digit Recovery Code from Email</label> <!-- Recovery Code Label -->
                <input type="text" id="recoveryCode" placeholder="Enter code" style="font-size: 1.2em; text-align: center; letter-spacing: 5px;" maxlength="4"> <!-- Textbox for Recovery Code -->
            </div> <!-- End of Recovery Code Input -->

            <div class="doubleinput"> <!-- Start of Password Pin Input -->

                <div class="signupinput" style="flex: 1; position: relative;"> <!-- Start of First Password Input -->
                    <label>New 4-Digit PIN</label> <!-- Label for First Password -->
                    <input type="password" id="newPin" placeholder="1234" maxlength="4" style="padding-right: 35px;"> <!-- Textbox for First Password -->
                    <span id="toggleNewPin" style="position: absolute; right: 10px; top: 35px; cursor: pointer; font-size: 18px;">👁️</span> <!-- Show Password Toggle -->
                </div> <!-- End of First Password Input -->

                <div class="signupinput" style="flex: 1; position: relative;"> <!-- Start of Confirm Password Pin Input -->
                    <label>Confirm PIN</label> <!-- Label for Confirm Password -->
                    <input type="password" id="confPin" placeholder="1234" maxlength="4" style="padding-right: 35px;"> <!-- Textbox for Confirm Password -->
                    <span id="toggleConfPin" style="position: absolute; right: 10px; top: 35px; cursor: pointer; font-size: 18px;">👁️</span> <!-- Show Password Toggle -->
                </div> <!-- End of Confirm Password Pin Input -->

            </div> <!-- End of Password Pin Input -->

            <div class="rulebox" id="rulesBox"> <!-- Start of Rule Box to Display Rules for Password -->
                <div id="rule-length" class="rule">❌ Must be exactly 4 characters</div> <!-- Must be 4 Characters -->
                <div id="rule-number" class="rule">❌ Must contain only numbers</div> <!-- Must be only Numbers -->
                <div id="rule-match" class="rule">❌ PINs must match</div> <!-- Must be Matching -->
            </div> <!-- End of Rule Box to Display Rules for Password -->

            <button class="buttons largebuttons" id="resetBtn" onclick="resetPassword()" disabled style="opacity: 0.5;">Reset Password</button> <!-- Reset Password Button -->

        </div> <!-- End of Step 2 Where you Create New Password -->

        <a href="index.html" style="display: block; margin-top: 20px; color: rgb(139, 107, 35); font-weight: bold; text-decoration: none;">← Back to Login</a> <!-- Back Button Link -->

    </div> <!-- End of Portal for recovery.html -->

    <script src="signupScript.js"></script> <!-- Links to signupScript.js File -->
    <script src="keyboardNav.js"></script> <!-- Links to keyboardNav.js File -->

</body> <!-- End of Body -->

</html> <!-- End of HTML -->
