<!DOCTYPE html> <!-- Start of HTML -->
<html lang="en"> <!-- Primary Language is English -->

<head> <!-- Start of Head -->
    <meta charset="UTF-8"> <!-- Tells What Characters to Use -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Matches Screen Width -->
    <title>MathTrack - Archive</title> <!-- Title of Page -->
    <link rel="icon" type="image/png" href="Images/logo.png"> <!-- Favicon -->
    <link href="styles.css" rel="stylesheet" /> <!-- Links to styles.css file -->
    <link href="darkmode.css" rel="stylesheet" /> <!-- Links to darkmode.css file -->
</head> <!-- End of Head -->

<body> <!-- Start of Body -->

    <div class="topnav datedisplayed"> <!-- Start of Date Displayed in Top Left -->
        <p id="currentdate" class="datedisplayedtext"></p> <!-- The Current Date -->
    </div> <!-- End of Date Displayed in Top Left -->

    <div class="topnav profile" onclick="openProfileModal()"> <!-- Start of Profile Displayed in Top Right -->
        <div id="profile-name" style="font-weight: bold; font-size: 1.1em; color: #3498db;"></div> <!-- Accounts Name -->
        <div id="profile-email" style="font-size: 0.85em; color: gray;"></div> <!-- Accounts Email Address -->
    </div> <!-- End of Profile Displayed in Top Right -->

    <div class="classportal"> <!-- Start of Portal for archive.html -->

        <h1 class="welcomeheader" style="margin-top: 0; margin-bottom: 10px; text-align: center;">Archived Classes</h1> <!-- Main Title -->
        <h2 class="subtitle" style="text-align: center; margin-bottom: 40px;">Recover or permanently delete your inactive classes:</h2> <!-- Subtitle -->

        <div class="newclass" id="archive-container"></div> <!-- The Bottom Area Where All The Classes Are Displayed -->

        <div id="profile-modal" class="modal"> <!-- Start of Profile Modal -->
            <div class="modalcontent" style="max-width: 450px; width: 100%;"> <!-- Start of Profile Modal Contents -->

                <h2 style="margin-top:0;">Edit Profile</h2> <!-- Title -->

                <div class="selectinput" style="justify-content: space-between;"> <!-- Start of First Name -->
                    <label>First Name:</label> <!-- Label For First Name -->
                    <input type="text" id="prof-fname"> <!-- Textbox for First Name -->
                </div> <!-- End of First Name -->

                <div class="selectinput" style="justify-content: space-between;"> <!-- Start of Last Name -->
                    <label>Last Name:</label> <!-- Label For Last Name -->
                    <input type="text" id="prof-lname"> <!-- Textbox for Last Name -->
                </div> <!-- End of Last Name -->

                <div class="selectinput" style="justify-content: space-between;"> <!-- Start of Email Address -->
                    <label>Username:</label> <!-- Label For Email Address -->
                    <input type="email" id="prof-email"> <!-- Textbox for Email Address -->
                </div> <!-- End of Email Address -->

                <div class="selectinput" style="justify-content: space-between;"> <!-- Start of App Password -->
                    <label>App Password:</label> <!-- Label For App Password -->
                    <div style="position: relative; flex: 1;"> <!-- Start of App Password Input -->
                        <input type="password" id="prof-apppass" style="width: 100%; box-sizing: border-box; padding-right: 30px;"> <!-- Textbox for App Password -->
                        <span id="toggleProfApp" style="position: absolute; right: 8px; top: 50%; transform: translateY(-50%); cursor: pointer;">👁️</span> <!-- Show Password Eye Toggle -->
                    </div> <!-- End of App Password Input -->
                </div> <!-- End of App Password -->

                <hr style="width:100%; border: 0; border-top: 1px solid var(--border-color, #ccc); margin: 20px 0;"> <!-- White Bar to Divide Top and Bottom Rows -->

                <div class="selectinput" style="justify-content: space-between;"> <!-- Start of Password -->
                    <label style="color: #e74c3c !important;">Confirm PIN:</label> <!-- Label For Password -->
                    <div style="position: relative; flex: 1;"> <!-- Start of Password Input -->
                        <input type="password" id="prof-pin" maxlength="4" placeholder="To authorize changes" style="width: 100%; box-sizing: border-box; padding-right: 30px;"> <!-- Textbox for Password -->
                        <span id="toggleProfPin" style="position: absolute; right: 8px; top: 50%; transform: translateY(-50%); cursor: pointer;">👁️</span> <!-- Show Password Eye Toggle -->
                    </div> <!-- End of Password Input -->
                </div> <!-- End of Password -->

                <div class="modalaction" style="margin-top: 20px; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap;"> <!-- Start of Bottom Row With Buttons -->
                    <button class="buttons saveprofile" style="border:none; border-radius:5px; padding: 10px 20px;" onclick="saveProfile()">Save Changes</button> <!-- Save Profile Button -->
                    <button class="buttons deleteprofile" style="border:none; border-radius:5px; padding: 10px 20px;" onclick="deleteAccount()">Delete Account</button> <!-- Delete Profile Button -->
                    <button class="buttons cancelprofile" style="border:none; border-radius:5px; padding: 10px 20px;" onclick="closeProfileModal()">Cancel</button> <!-- Close Profile Popup Button -->
                </div> <!-- End of Bottom Row With Buttons -->

            </div> <!-- End of Profile Modal Contents -->
        </div> <!-- End of Profile Modal -->

        <hr style="border: 0; border-top: 1px solid var(--border-color, #ccc); margin: 40px 0 20px 0; width: 100%;"> <!-- White Bar to Divide Top and Bottom Rows -->

        <div style="display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; width: 100%; box-sizing: border-box;"> <!-- Start of Bottom Row -->
            <div style="display: flex; justify-content: flex-start;"> <!-- Start of Bottom Left -->
                <a href="select.html" class="buttons backbuttons" style="border:none; border-radius:5px; padding: 10px 20px; text-decoration: none; margin: 0;"> back </a> <!-- Back Button -->
            </div> <!-- End of Bottom Left -->
            
            <div></div> <!-- Bottom Middle -->

            <div style="display: flex; justify-content: flex-end; align-items: center; gap: 10px;"> <!-- Start of Location for Darkmode Toggle -->
                <span class="darkmode-label">Dark Mode</span> <!-- Darkmode Label -->
                <label class="switch"> <!-- Start of Darkmode Toggle -->
                    <input type="checkbox" id="theme-toggle"> <!-- Creates Toffle -->
                    <span class="slider round"></span> <!-- Makes it Circle Toggle -->
                </label> <!-- End of Darkmode Toggle -->
            </div> <!-- End of Location for Darkmode Toggle -->
        </div> <!-- End of Bottom Row -->

    </div> <!-- End of Portal for archive.html -->

    <script>
        const themeToggle = document.getElementById('theme-toggle');
        const body = document.body;

        if (localStorage.getItem('theme') === 'dark') {
            body.classList.add('darkmode');
            if (themeToggle) themeToggle.checked = true;
        }

        if (themeToggle) {
            themeToggle.addEventListener('change', function () {
                if (this.checked) {
                    body.classList.add('darkmode');
                    localStorage.setItem('theme', 'dark');
                } else {
                    body.classList.remove('darkmode');
                    localStorage.setItem('theme', 'light');
                }
            });
        }

        const currentUser = JSON.parse(localStorage.getItem('currentUser'));
        if (!currentUser) window.location.href = 'index.html';

        document.getElementById('currentdate').textContent = new Date().toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

        const profNameEl = document.getElementById('profile-name');
        if (profNameEl) {
            profNameEl.textContent = `${currentUser.firstName} ${currentUser.lastName}`;
        }
        document.getElementById('profile-email').textContent = currentUser.email;

        // Toggle Password visibility for profile modal
        function attachEyeToggles() {
            const toggleApp = document.getElementById('toggleProfApp');
            const togglePin = document.getElementById('toggleProfPin');
            if (toggleApp) {
                toggleApp.addEventListener('click', function () {
                    const input = document.getElementById('prof-apppass');
                    const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
                    input.setAttribute('type', type);
                    this.textContent = type === 'password' ? '👁️' : '🔒';
                });
            }
            if (togglePin) {
                togglePin.addEventListener('click', function () {
                    const input = document.getElementById('prof-pin');
                    const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
                    input.setAttribute('type', type);
                    this.textContent = type === 'password' ? '👁️' : '🔒';
                });
            }
        }
        attachEyeToggles();

        // Profile Modal Logic
        function openProfileModal() {
            document.getElementById('prof-fname').value = currentUser.firstName;
            document.getElementById('prof-lname').value = currentUser.lastName;
            document.getElementById('prof-email').value = currentUser.email;
            document.getElementById('prof-apppass').value = currentUser.appPassword || '';
            document.getElementById('prof-pin').value = '';

            document.getElementById('prof-apppass').setAttribute('type', 'password');
            document.getElementById('prof-pin').setAttribute('type', 'password');
            if (document.getElementById('toggleProfApp')) document.getElementById('toggleProfApp').textContent = '👁️';
            if (document.getElementById('toggleProfPin')) document.getElementById('toggleProfPin').textContent = '👁️';

            document.getElementById('profile-modal').style.display = 'flex';
        }

        function closeProfileModal() {
            document.getElementById('profile-modal').style.display = 'none';
        }

        async function saveProfile() {
            const pin = document.getElementById('prof-pin').value;
            if (pin !== currentUser.pin) return alert("Incorrect PIN! Cannot save changes.");

            const newFname = document.getElementById('prof-fname').value.trim();
            const newLname = document.getElementById('prof-lname').value.trim();
            const newEmail = document.getElementById('prof-email').value.trim().toLowerCase();
            const newAppPass = document.getElementById('prof-apppass').value.trim();

            if (!newFname || !newLname || !newEmail || !newAppPass) return alert("All fields are required.");

            const users = JSON.parse(localStorage.getItem('mathTrackUsers')) || {};

            if (newEmail !== currentUser.email && users[newEmail]) return alert("Email already in use!");

            const oldEmail = currentUser.email;

            if (newEmail !== oldEmail) {
                try {
                    await fetch('http://localhost:3000/api/migrate-email', {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ oldEmail, newEmail })
                    });
                } catch (e) { console.error("DB Migration Error", e); }

                const keysToMigrate = [];
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    if (key && key.includes(oldEmail)) keysToMigrate.push(key);
                }
                keysToMigrate.forEach(key => {
                    const newKey = key.replace(oldEmail, newEmail);
                    localStorage.setItem(newKey, localStorage.getItem(key));
                    localStorage.removeItem(key);
                });
            }

            delete users[oldEmail];
            const updatedUser = { firstName: newFname, lastName: newLname, email: newEmail, appPassword: newAppPass, pin: currentUser.pin };
            users[newEmail] = updatedUser;

            localStorage.setItem('mathTrackUsers', JSON.stringify(users));
            localStorage.setItem('currentUser', JSON.stringify(updatedUser));

            alert("Profile updated successfully!");
            window.location.reload();
        }

        async function deleteAccount() {
            const pin = document.getElementById('prof-pin').value;
            if (!pin) return alert("Please enter your PIN to authorize account deletion.");
            if (pin !== currentUser.pin) return alert("Incorrect PIN! Cannot delete account.");

            if (confirm("WARNING: Are you absolutely sure you want to delete your account? This will permanently erase all your classes, students, and grades. This action CANNOT be undone.")) {

                const email = currentUser.email;
                const users = JSON.parse(localStorage.getItem('mathTrackUsers')) || {};

                const storageKey = `savedClasses_${email}`;
                const archiveKey = `archivedClasses_${email}`;

                const userClasses = JSON.parse(localStorage.getItem(storageKey)) || [];
                const archivedClasses = JSON.parse(localStorage.getItem(archiveKey)) || [];

                const allClasses = [...userClasses, ...archivedClasses].filter(c => c !== null);

                for (let i = 0; i < allClasses.length; i++) {
                    const uniqueDbClassName = email + "_" + allClasses[i].name;
                    try {
                        await fetch(`http://localhost:3000/api/delete-class/${encodeURIComponent(uniqueDbClassName)}`, { method: 'DELETE' });
                    } catch (e) {
                        console.error("Error deleting class from database:", e);
                    }
                }

                const keysToDelete = [];
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    if (key && key.includes(email)) {
                        keysToDelete.push(key);
                    }
                }
                keysToDelete.forEach(k => localStorage.removeItem(k));

                delete users[email];
                localStorage.setItem('mathTrackUsers', JSON.stringify(users));
                localStorage.removeItem('currentUser');

                alert("Account permanently deleted.");
                window.location.href = 'index.html';
            }
        }

        const storageKey = currentUser ? `savedClasses_${currentUser.email}` : 'savedClasses';
        const archiveKey = currentUser ? `archivedClasses_${currentUser.email}` : 'archivedClasses';

        let archivedData = JSON.parse(localStorage.getItem(archiveKey)) || [];

        function renderArchives() {
            const grid = document.getElementById('archive-container');
            grid.innerHTML = '';

            if (archivedData.length === 0) {
                grid.innerHTML = '<p style="color: var(--text-color, #333); font-size: 1.2em; grid-column: 1/-1; text-align: center; margin-top: 50px;">No archived classes found.</p>';
                return;
            }

            for (let i = 0; i < archivedData.length; i++) {
                const cls = archivedData[i];
                if (!cls) continue;

                const wrapper = document.createElement('div');
                wrapper.className = 'cardwrapper';

                const letter = document.createElement('div');
                letter.className = 'cardletter';

                // Recalls the original letter of the slot it was in (natively adapts to dark/light text color)
                letter.textContent = cls.originalIndex !== undefined ? String.fromCharCode(65 + (cls.originalIndex % 4)) : '?';

                // Build the active-style class card structure
                const card = document.createElement('div');
                card.className = 'classcard';
                card.style.backgroundColor = cls.bgColor || '#f9f9f9';
                card.style.opacity = '0.75'; // Slightly faded to indicate it's archived

                // .cardedit pushes top-left, .carddelete pushes top-right via styles.css
                card.innerHTML = `
                    <button class="buttons cardedit cardrecover" title="Recover Class" onclick="event.stopPropagation(); recoverClass(${i})">↩</button>
                    <button class="buttons carddelete cardpermadelete" title="Permanently Delete" onclick="event.stopPropagation(); permanentDelete(${i})">🗑️</button>
                   
                    <div style="padding-top: 10px; font-family: ${cls.font || 'inherit'}; text-align: center;">
                        <div class="class-title" style="color: ${cls.textColor || 'rgb(139, 107, 35)'};">${cls.name}</div>
                       
                        <p style="color: ${cls.textColor || 'black'}; margin-top: 15px;">Students: <span style="font-weight:normal">${cls.students || 0}</span></p>
                        <p style="color: ${cls.textColor || 'black'};">Status: <span style="font-weight:bold; color: #e67e22;">Archived</span></p>
                    </div>
                `;

                wrapper.appendChild(letter);
                wrapper.appendChild(card);
                grid.appendChild(wrapper);
            }
        }

        function recoverClass(index) {
            let classData = JSON.parse(localStorage.getItem(storageKey));

            // Reinitialize if array structure is corrupted or missing
            if (!Array.isArray(classData) || classData.length !== 8) {
                classData = new Array(8).fill(null);
            }

            let recoveredClass = archivedData[index];
            let targetIndex = recoveredClass.originalIndex;

            // Check if the original slot is empty, otherwise find the first available
            if (targetIndex !== undefined && classData[targetIndex] === null) {
                classData[targetIndex] = recoveredClass;
            } else {
                let foundSlot = false;
                for (let j = 0; j < 8; j++) {
                    if (classData[j] === null) {
                        classData[j] = recoveredClass;
                        foundSlot = true;
                        break;
                    }
                }
                if (!foundSlot) {
                    alert("Your active roster is full (Max 8 slots). Please archive or delete an active class before recovering this one.");
                    return;
                }
            }

            // Remove from archive and set to active
            archivedData.splice(index, 1);
            localStorage.setItem(archiveKey, JSON.stringify(archivedData));
            localStorage.setItem(storageKey, JSON.stringify(classData));

            renderArchives();
            alert("Class recovered successfully! It is now visible on your Select Class screen.");
        }

        async function permanentDelete(index) {
            if (confirm("WARNING: Are you absolutely sure you want to permanently delete this class? ALL student data, marks, and lessons will be erased. This CANNOT be undone.")) {
                const uniqueDbClassName = currentUser.email + "_" + archivedData[index].name;

                try {
                    // Permanently purge data arrays from database tracking system
                    await fetch(`http://localhost:3000/api/delete-class/${encodeURIComponent(uniqueDbClassName)}`, { method: 'DELETE' });

                    // Purge isolated structures out of LocalStorage
                    localStorage.removeItem(`units_${uniqueDbClassName}`);
                    localStorage.removeItem(`lessons_${uniqueDbClassName}`);
                    localStorage.removeItem(`marks_${uniqueDbClassName}`);
                    localStorage.removeItem(`studentOrder_${uniqueDbClassName}`);
                    localStorage.removeItem(`emailTemplate_${uniqueDbClassName}`);

                    // Remove from active archive array layout
                    archivedData.splice(index, 1);
                    localStorage.setItem(archiveKey, JSON.stringify(archivedData));

                    renderArchives();
                } catch (e) {
                    alert("Failed to permanently delete class information from server.");
                }
            }
        }

        window.onload = renderArchives;
    </script>
    <script src="keyboardNav.js"></script> <!-- Links to keyboardNav.js File -->

</body> <!-- End of Body -->

</html> <!-- End of HTML -->
