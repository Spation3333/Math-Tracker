<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Class</title>
    <link rel="icon" type="image/jpeg" href="Images/logo.jpg">
    <link href="styles.css" rel="stylesheet" />
    <style>
        .profile-widget {
            position: absolute;
            top: 15px;
            left: 20px;
            cursor: pointer;
            background: #fff;
            padding: 10px 15px;
            border-radius: 8px;
            border: 2px solid rgb(139, 107, 35);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            z-index: 100;
            text-align: left;
        }

        body.darkmode .profile-widget {
            background: #2d2d2d;
            border-color: rgb(212, 175, 55);
        }
    </style>
</head>

<body>

    <div class="profile-widget" onclick="openProfileModal()">
        <div id="profile-name" style="font-weight: bold; font-size: 1.1em; color: rgb(139, 107, 35);"></div>
        <div id="profile-email" style="font-size: 0.85em; color: gray;"></div>
    </div>

    <p id="currentdate" class="datedisplay" style="top: 80px;"></p>

    <h1 id="welcome-header" class="welcomeheader" style="margin-top: 80px;">Welcome Ms. Bourassa!</h1>
    <h2 class="subtitle">Select your class:</h2>

    <div class="newclass" id="newclass"></div>

    <div id="modal" class="modal">
        <div class="modalcontent">
            <h2 id="modalheader">Create New Class</h2>
            <input type="hidden" id="edit-index" value="-1">
            <div class="signupinput"><label for="classname">Class Name:</label><input type="text" id='classname'
                    placeholder='e.g. Grade 9 Math - MTH1W'></div>
            <div class="signupinput"><label for="weeklylesson">Weekly Lesson:</label><input type="text"
                    id='weeklylesson' placeholder='e.g. 1.1 - 1.7'></div>
            <div class="signupinput"><label for="evaluation">Next Evaluation:</label><input type="text" id='evaluation'
                    placeholder='e.g. Feb 20'></div>
            <div class="signupinput">
                <label for="font-family">Card Font:</label>
                <select id="font-family" style="padding: 8px; width: 100%; border: 1px solid #ccc; border-radius: 4px;">
                    <option value="'Segoe UI', Tahoma, Geneva, Verdana, sans-serif">Default (Segoe UI)</option>
                    <option value="'Times New Roman', Times, serif">Times New Roman</option>
                    <option value="Arial, Helvetica, sans-serif">Arial</option>
                    <option value="'Courier New', Courier, monospace">Courier New</option>
                    <option value="'Comic Sans MS', cursive, sans-serif">Comic Sans</option>
                </select>
            </div>
            <div class="signupinput">
                <label>Background Color:</label>
                <div style="display: flex; gap: 10px;">
                    <select id="bg-color-select" onchange="toggleCustomColor('bg')"
                        style="padding: 8px; flex: 1; border: 1px solid #ccc; border-radius: 4px;">
                        <option value="#f9f9f9">Default (Off-White)</option>
                        <option value="#000000">Black</option>
                        <option value="#ffcccc">Pastel Red</option>
                        <option value="#ccffcc">Pastel Green</option>
                        <option value="#ccccff">Pastel Blue</option>
                        <option value="#ffffcc">Pastel Yellow</option>
                        <option value="custom">Custom RGB...</option>
                    </select>
                    <input type="color" id="bg-color-custom"
                        style="display:none; width: 40px; height: 35px; padding: 0; border: none; cursor: pointer;">
                </div>
            </div>
            <div class="signupinput">
                <label>Text Color:</label>
                <div style="display: flex; gap: 10px;">
                    <select id="text-color-select" onchange="toggleCustomColor('text')"
                        style="padding: 8px; flex: 1; border: 1px solid #ccc; border-radius: 4px;">
                        <option value="#000000">Default (Black)</option>
                        <option value="#ffffff">White</option>
                        <option value="#e74c3c">Red</option>
                        <option value="#27ae60">Green</option>
                        <option value="#2980b9">Blue</option>
                        <option value="custom">Custom RGB...</option>
                    </select>
                    <input type="color" id="text-color-custom"
                        style="display:none; width: 40px; height: 35px; padding: 0; border: none; cursor: pointer;">
                </div>
            </div>
            <div class="modalaction">
                <button class="buttons" onclick="saveClass()">Save</button>
                <button class="buttons cancelbutton" onclick="closeClass()">Cancel</button>
            </div>
        </div>
    </div>

    <div id="profile-modal" class="modal">
        <div class="modalcontent" style="max-width: 450px; width: 100%;">
            <h2 style="margin-top:0;">Edit Profile</h2>
            <div class="signupinput" style="justify-content: space-between;"><label>First Name:</label><input
                    type="text" id="prof-fname"></div>
            <div class="signupinput" style="justify-content: space-between;"><label>Last Name:</label><input type="text"
                    id="prof-lname"></div>
            <div class="signupinput" style="justify-content: space-between;"><label>Username:</label><input type="email"
                    id="prof-email"></div>
            <div class="signupinput" style="justify-content: space-between;"><label>App Password:</label><input
                    type="password" id="prof-apppass"></div>

            <hr style="width:100%; border: 0; border-top: 1px solid var(--border-color, #ccc); margin: 20px 0;">

            <div class="signupinput" style="justify-content: space-between;">
                <label style="color:var(--danger, red);">Confirm PIN:</label>
                <input type="password" id="prof-pin" maxlength="4" placeholder="To save changes">
            </div>

            <div class="modalaction" style="margin-top: 20px; display: flex; justify-content: center; gap: 15px;">
                <button class="buttons" onclick="saveProfile()">Change</button>
                <button class="buttons cancelbutton" onclick="closeProfileModal()">Cancel</button>
            </div>
        </div>
    </div>

    <div class="bottomnav">
        <a href="index.html" class="buttons backbuttons"> back </a>
    </div>
    <div class="themewrapper">
        <label class="switch"><input type="checkbox" id="theme-toggle"><span class="slider round"></span></label>
    </div>

    <script src="script.js"></script>
</body>

</html>
