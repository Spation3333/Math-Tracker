<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Class</title>
    <link rel="icon" type="image/jpeg" href="Images/logo.jpg">
    <link href="styles.css" rel="stylesheet" />
    <link href="darkmode.css" rel="stylesheet" />
    <style>
        select,
        textarea {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
        }

        .top-widget {
            position: absolute;
            top: 20px;
            background: var(--card-bg, #fff);
            padding: 10px 20px;
            border-radius: 8px;
            border: 2px solid rgb(139, 107, 35);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 65px;
            box-sizing: border-box;
        }

        body.darkmode .top-widget {
            background: #2d2d2d;
            border-color: rgb(212, 175, 55);
        }

        .profile-widget {
            right: 20px;
            cursor: pointer;
            text-align: right;
        }

        .date-widget {
            left: 20px;
            text-align: left;
        }

        .date-widget-text {
            font-weight: bold;
            color: rgb(139, 107, 35);
            font-size: 1.1em;
            margin: 0;
        }

        body.darkmode .date-widget-text {
            color: rgb(212, 175, 55);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modalcontent {
            background-color: var(--card-bg, #fff);
            padding: 30px;
            border-radius: 10px;
            border: 3px solid rgb(139, 107, 35);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .selectinput {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .selectinput label {
            font-weight: bold;
            width: 140px;
            text-align: left;
        }

        .selectinput input,
        .selectinput select {
            flex: 1;
            padding: 8px;
            border: 1px solid var(--border-color, #ccc);
            border-radius: 4px;
            background: var(--input-bg, #fff);
            color: var(--text-color, #000);
            font-family: inherit;
        }

        /* Ensure 4 items per row */
        .newclass {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto 40px auto;
            justify-items: center;
        }

        .btn-primary {
            background-color: #3498db;
            color: white;
        }

        .btn-danger {
            background-color: #c0392b;
            color: white;
        }

        .btn-cancel {
            background-color: #95a5a6;
            color: white;
        }
    </style>
</head>

<body>

    <div class="top-widget date-widget">
        <p id="currentdate" class="date-widget-text"></p>
    </div>

    <div class="top-widget profile-widget" onclick="openProfileModal()">
        <div id="profile-name" style="font-weight: bold; font-size: 1.1em; color: rgb(139, 107, 35);"></div>
        <div id="profile-email" style="font-size: 0.85em; color: gray;"></div>
    </div>

    <div style="flex: 1; width: 100%;">
        <h1 id="welcome-header" class="welcomeheader"
            style="margin-top: 50px; text-align: center; margin-bottom: 10px;">Welcome Ms. Bourassa!</h1>
        <h2 class="subtitle" style="text-align: center; margin-bottom: 40px;">Select your class:</h2>

        <div class="newclass" id="newclass"></div>
    </div>

    <div id="modal" class="modal">
        <div class="modalcontent">
            <h2 id="modalheader">Create New Class</h2>
            <input type="hidden" id="edit-index" value="-1">
            <div class="selectinput"><label for="classname">Class Name:</label><input type="text" id='classname'
                    placeholder='e.g. Grade 9 Math - MTH1W'></div>

            <div class="selectinput">
                <label for="font-family">Card Font:</label>
                <select id="font-family">
                    <option value="'Segoe UI', Tahoma, Geneva, Verdana, sans-serif">Default (Segoe UI)</option>
                    <option value="'Times New Roman', Times, serif">Times New Roman</option>
                    <option value="Arial, Helvetica, sans-serif">Arial</option>
                    <option value="'Courier New', Courier, monospace">Courier New</option>
                    <option value="'Comic Sans MS', cursive, sans-serif">Comic Sans</option>
                </select>
            </div>
            <div class="selectinput">
                <label>Background Color:</label>
                <div style="display: flex; gap: 10px;">
                    <select id="bg-color-select" onchange="toggleCustomColor('bg')">
                        <option value="#f9f9f9">Default (Off-White)</option>
                        <option value="#000000">Black</option>
                        <option value="#ffcccc">Pastel Red</option>
                        <option value="#ccffcc">Pastel Green</option>
                        <option value="#ccccff">Pastel Blue</option>
                        <option value="#ffffcc">Pastel Yellow</option>
                        <option value="custom">Custom RGB...</option>
                    </select>
                    <input type="color" id="bg-color-custom"
                        style="display:none; width: 40px; height: 35px; padding: 0; border: none; cursor: pointer;">
                </div>
            </div>
            <div class="selectinput">
                <label>Text Color:</label>
                <div style="display: flex; gap: 10px;">
                    <select id="text-color-select" onchange="toggleCustomColor('text')">
                        <option value="#000000">Default (Black)</option>
                        <option value="#ffffff">White</option>
                        <option value="#e74c3c">Red</option>
                        <option value="#27ae60">Green</option>
                        <option value="#2980b9">Blue</option>
                        <option value="custom">Custom RGB...</option>
                    </select>
                    <input type="color" id="text-color-custom"
                        style="display:none; width: 40px; height: 35px; padding: 0; border: none; cursor: pointer;">
                </div>
            </div>
            <div class="modalaction" style="margin-top: 20px; display: flex; justify-content: center; gap: 10px;">
                <button class="buttons" style="border:none; border-radius:5px;" onclick="saveClass()">Save</button>
                <button class="buttons cancelbutton"
                    style="border:none; border-radius:5px; background-color: #95a5a6; color: white;"
                    onclick="closeClass()">Cancel</button>
            </div>
        </div>
    </div>

    <div id="profile-modal" class="modal">
        <div class="modalcontent" style="max-width: 450px; width: 100%;">
            <h2 style="margin-top:0;">Edit Profile</h2>
            <div class="selectinput" style="justify-content: space-between;"><label>First Name:</label><input
                    type="text" id="prof-fname"></div>
            <div class="selectinput" style="justify-content: space-between;"><label>Last Name:</label><input type="text"
                    id="prof-lname"></div>
            <div class="selectinput" style="justify-content: space-between;"><label>Username:</label><input type="email"
                    id="prof-email"></div>

            <div class="selectinput" style="justify-content: space-between;">
                <label>App Password:</label>
                <div style="position: relative; flex: 1;">
                    <input type="password" id="prof-apppass"
                        style="width: 100%; box-sizing: border-box; padding-right: 30px;">
                    <span id="toggleProfApp"
                        style="position: absolute; right: 8px; top: 50%; transform: translateY(-50%); cursor: pointer;">👁️</span>
                </div>
            </div>

            <hr style="width:100%; border: 0; border-top: 1px solid var(--border-color, #ccc); margin: 20px 0;">

            <div class="selectinput" style="justify-content: space-between;">
                <label style="color:var(--danger, #e74c3c);">Confirm PIN:</label>
                <div style="position: relative; flex: 1;">
                    <input type="password" id="prof-pin" maxlength="4" placeholder="To authorize changes"
                        style="width: 100%; box-sizing: border-box; padding-right: 30px;">
                    <span id="toggleProfPin"
                        style="position: absolute; right: 8px; top: 50%; transform: translateY(-50%); cursor: pointer;">👁️</span>
                </div>
            </div>

            <div class="modalaction"
                style="margin-top: 20px; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap;">
                <button class="buttons btn-primary" style="border:none; border-radius:5px; padding: 10px 20px;"
                    onclick="saveProfile()">Save Changes</button>
                <button class="buttons btn-danger" style="border:none; border-radius:5px; padding: 10px 20px;"
                    onclick="deleteAccount()">Delete Account</button>
                <button class="buttons btn-cancel" style="border:none; border-radius:5px; padding: 10px 20px;"
                    onclick="closeProfileModal()">Cancel</button>
            </div>
        </div>
    </div>

    <div
        style="display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 20px 30px; width: 100%; box-sizing: border-box; margin-top: auto;">

        <div style="display: flex; justify-content: flex-start;">
            <a href="index.html" class="buttons backbuttons"
                style="border:none; border-radius:5px; padding: 10px 20px; text-decoration: none; margin: 0;"> back </a>
        </div>

        <div style="display: flex; justify-content: center;">
            <a href="archive.html" class="buttons"
                style="background-color: #3498db; color: white; border:none; border-radius:5px; padding: 10px 20px; text-decoration: none; margin: 0; font-weight: bold;">Archived
                Classes</a>
        </div>

        <div style="display: flex; justify-content: flex-end; align-items: center; gap: 10px;">
            <span style="font-size: 0.9em; font-weight: bold; color: var(--text-color, #333);">Dark Mode</span>
            <label class="switch" style="margin: 0;">
                <input type="checkbox" id="theme-toggle">
                <span class="slider round"></span>
            </label>
        </div>

    </div>

    <script src="script.js"></script>
</body>

</html>
