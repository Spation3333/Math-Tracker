<!DOCTYPE html> <!-- Start of HTML -->
<html lang="en"> <!-- Primary Language is English -->

<head> <!-- Start of Head -->
    <meta charset="UTF-8"> <!-- Tells What Characters to Use -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Matches Screen Width -->
    <title>MathTrack - Select</title> <!-- Title of Page -->
    <link rel="icon" type="image/png" href="Images/logo.png"> <!-- Favicon -->
    <link href="styles.css" rel="stylesheet" /> <!-- Links to styles.css file -->
    <link href="darkmode.css" rel="stylesheet" /> <!-- Links to darkmode.css file -->
</head> <!-- End of Head -->

<body> <!-- Start of Body -->

    <div class="topnav datedisplayed"> <!-- Start of Date Displayed in Top Left -->
        <p id="currentdate" class="datedisplayedtext"></p> <!-- The Current Date -->
    </div> <!-- End of Date Displayed in Top Left -->

    <div class="topnav profile" onclick="openProfileModal()"> <!-- Start of Profile Displayed in Top Right -->
        <div id="profile-name" style="font-weight: bold; font-size: 1.1em; color: #3498db;"></div> <!-- Accounts Name -->
        <div id="profile-email" style="font-size: 0.85em; color: gray;"></div> <!-- Accounts Email Address -->
    </div> <!-- End of Profile Displayed in Top Right -->

    <div class="classportal"> <!-- Start of Portal for select.html -->

        <h1 id="welcome-header" class="welcomeheader" style="margin-top: 0; text-align: center; margin-bottom: 10px;">Welcome Ms. Bourassa!</h1> <!-- Main Title -->
        <h2 class="subtitle" style="text-align: center; margin-bottom: 40px;">Select your class:</h2> <!-- Subtitle -->

        <div class="newclass" id="newclass"></div> <!-- The Bottom Area Where All The Classes Are Displayed -->

        <div id="modal" class="modal"> <!-- Start of Class Modal -->
            <div class="modalcontent"> <!-- Start of Class Modal Contents -->

                <h2 id="modalheader">Create New Class</h2> <!-- Title -->
                <input type="hidden" id="edit-index" value="-1"> <!-- Class Index -->

                <div class="selectinput"> <!-- Start of Class Name -->
                    <label for="classname">Class Name:</label> <!-- Label for Class Name -->
                    <input type="text" id='classname' placeholder='e.g. Grade 9 Math - MTH1W'> <!-- Textbox for Class Name -->
                </div> <!-- End of Class Name -->

                <div class="selectinput"> <!-- Start of Class Fonts -->
                    <label for="font-family">Card Font:</label> <!-- Label for Class Fonts -->
                    <select id="font-family"> <!-- Start of Class Fonts Dropdown -->
                        <option value="'Segoe UI', Tahoma, Geneva, Verdana, sans-serif">Default (Segoe UI)</option> <!-- Default Segoe UI -->
                        <option value="Arial, Helvetica, sans-serif">Arial</option> <!-- Arial -->
                        <option value="'Times New Roman', Times, serif">Times New Roman</option> <!-- Times New Roman -->
                        <option value="'Courier New', Courier, monospace">Courier New</option> <!-- Courier New -->
                        <option value="'Comic Sans MS', cursive, sans-serif">Comic Sans</option> <!-- Comic Sans -->
                        <option value="'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif">Trebuchet MS</option> <!-- Trebuchet MS -->
                        <option value="Verdana, Geneva, Tahoma, sans-serif">Verdana</option> <!-- Verdana -->
                    </select> <!-- End of Class Fonts Dropdown -->
                </div> <!-- End of Class Fonts -->

                <div class="selectinput"> <!-- Start of Class Background Color -->
                    <label>Background Color:</label> <!-- Label for Background Color -->
                    <div style="display: flex; gap: 10px; flex: 1;"> <!-- Start of Background Color Input -->
                        <select id="bg-color-select" onchange="toggleCustomColor('bg')" style="flex: 1; width: 100%; box-sizing: border-box;"> <!-- Start of Class Background Color Dropdown -->
                            <option value="#f9f9f9">Default (Off-White)</option> <!-- Default White -->
                            <option value="#ffb3ba">Pastel Red</option> <!-- Pastel Red -->
                            <option value="#ffdfba">Pastel Orange</option> <!-- Pastel Orange -->
                            <option value="#ffffba">Pastel Yellow</option> <!-- Pastel Yellow -->
                            <option value="#baffc9">Pastel Green</option> <!-- Pastel Green -->
                            <option value="#bae1ff">Pastel Blue</option> <!-- Pastel Blue -->
                            <option value="#d4c4fb">Pastel Indigo</option> <!-- Pastel Indigo -->
                            <option value="#f4d8fb">Pastel Violet</option> <!-- Pastel Violet -->
                            <option value="#000000">Black</option> <!-- Black -->
                            <option value="custom">Custom RGB...</option> <!-- Custom Color -->
                        </select> <!-- End of Class Background Color Dropdown -->
                        <input type="color" id="bg-color-custom" style="display:none; width: 40px; height: 35px; padding: 0; border: none; cursor: pointer; flex-shrink: 0;"> <!-- Custom Color Selector -->
                    </div> <!-- End of Background Color Input -->
                </div> <!-- End of Class Background Color -->

                <div class="selectinput"> <!-- Start of Class Text Color -->
                    <label>Text Color:</label> <!-- Label for Text Color -->
                    <div style="display: flex; gap: 10px; flex: 1;"> <!-- Start of Text Color Input -->
                        <select id="text-color-select" onchange="toggleCustomColor('text')" style="flex: 1; width: 100%; box-sizing: border-box;"> <!-- Start of Class Text Color Dropdown -->
                            <option value="#000000">Default (Black)</option> <!-- Default Black -->
                            <option value="#e74c3c">Red</option> <!-- Red -->
                            <option value="#e67e22">Orange</option> <!-- Orange -->
                            <option value="#f1c40f">Yellow</option> <!-- Yellow -->
                            <option value="#27ae60">Green</option> <!-- Green -->
                            <option value="#2980b9">Blue</option> <!-- Blue -->
                            <option value="#3f51b5">Indigo</option> <!-- Indigo -->
                            <option value="#8e44ad">Violet</option> <!-- Violet -->
                            <option value="#ffffff">White</option> <!-- White -->
                            <option value="custom">Custom RGB...</option> <!-- Custom Color -->
                        </select> <!-- End of Class Text Color Dropdown -->
                        <input type="color" id="text-color-custom" style="display:none; width: 40px; height: 35px; padding: 0; border: none; cursor: pointer; flex-shrink: 0;"> <!-- Custom Color Selector -->
                    </div> <!-- End of Text Color Input -->
                </div> <!-- End of Class Text Color -->

                <div class="modalaction" style="margin-top: 20px; display: flex; justify-content: center; gap: 10px;"> <!-- Start of Bottom Area With Buttons -->
                    <button class="buttons" style="border:none; border-radius:5px;" onclick="saveClass()">Save</button> <!-- Save Class Button -->
                    <button class="buttons cancelbutton" style="border:none; border-radius:5px; background-color: #95a5a6; color: white;" onclick="closeClass()">Cancel</button> <!-- Cancel Class Button -->
                </div> <!-- End of Bottom Area With Buttons -->

            </div> <!-- End of Class Modal Contents -->
        </div> <!-- End of Class Modal -->

        <div id="profile-modal" class="modal"> <!-- Start of Profile Modal -->
            <div class="modalcontent" style="max-width: 450px; width: 100%;"> <!-- Start of Profile Modal Contents -->
                
                <h2 style="margin-top:0;">Edit Profile</h2> <!-- Title -->

                <div class="selectinput" style="justify-content: space-between;"> <!-- Start of First Name -->
                    <label>First Name:</label> <!-- Label For First Name -->
                    <input type="text" id="prof-fname"> <!-- Textbox for First Name -->
                </div> <!-- End of First Name -->

                <div class="selectinput" style="justify-content: space-between;"> <!-- Start of Last Name -->
                    <label>Last Name:</label> <!-- Label For Last Name -->
                    <input type="text" id="prof-lname"> <!-- Textbox for Last Name -->
                </div> <!-- End of Last Name -->

                <div class="selectinput" style="justify-content: space-between;"> <!-- Start of Email Address -->
                    <label>Username:</label> <!-- Label For Email Address -->
                    <input type="email" id="prof-email"> <!-- Textbox for Email Address -->
                </div> <!-- End of Email Address -->

                <div class="selectinput" style="justify-content: space-between;"> <!-- Start of App Password -->
                    <label>App Password:</label> <!-- Label For App Password -->
                    <div style="position: relative; flex: 1;"> <!-- Start of App Password Input -->
                        <input type="password" id="prof-apppass" style="width: 100%; box-sizing: border-box; padding-right: 30px;"> <!-- Textbox for App Password -->
                        <span id="toggleProfApp" style="position: absolute; right: 8px; top: 50%; transform: translateY(-50%); cursor: pointer;">👁️</span> <!-- Show Password Eye Toggle -->
                    </div> <!-- End of App Password Input -->
                </div> <!-- End of App Password -->

                <hr style="width:100%; border: 0; border-top: 1px solid var(--border-color, #ccc); margin: 20px 0;"> <!-- White Bar to Divide Top and Bottom Rows -->

                <div class="selectinput" style="justify-content: space-between;"> <!-- Start of Password -->
                    <label style="color: #e74c3c !important;">Confirm PIN:</label> <!-- Label For Password -->
                    <div style="position: relative; flex: 1;"> <!-- Start of Password Input -->
                        <input type="password" id="prof-pin" maxlength="4" placeholder="To authorize changes" style="width: 100%; box-sizing: border-box; padding-right: 30px;"> <!-- Textbox for Password -->
                        <span id="toggleProfPin" style="position: absolute; right: 8px; top: 50%; transform: translateY(-50%); cursor: pointer;">👁️</span> <!-- Show Password Eye Toggle -->
                    </div> <!-- End of Password Input -->
                </div> <!-- End of Password -->

                <div class="modalaction" style="margin-top: 20px; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap;"> <!-- Start of Bottom Row With Buttons -->
                    <button class="buttons saveprofile" style="border:none; border-radius:5px; padding: 10px 20px;" onclick="saveProfile()">Save Changes</button> <!-- Save Profile Button -->
                    <button class="buttons deleteprofile" style="border:none; border-radius:5px; padding: 10px 20px;" onclick="deleteAccount()">Delete Account</button> <!-- Delete Profile Button -->
                    <button class="buttons cancelprofile" style="border:none; border-radius:5px; padding: 10px 20px;" onclick="closeProfileModal()">Cancel</button> <!-- Close Profile Popup Button -->
                </div> <!-- End of Bottom Row With Buttons -->

            </div> <!-- End of Profile Modal Contents -->
        </div> <!-- End of Profile Modal -->

        <hr style="border: 0; border-top: 1px solid var(--border-color, #ccc); margin: 40px 0 20px 0; width: 100%;"> <!-- White Bar to Divide Top and Bottom Rows -->

        <div style="display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; width: 100%; box-sizing: border-box;"> <!-- Start of Bottom Row -->
            <div style="display: flex; justify-content: flex-start;"> <!-- Start of Bottom Left -->
                <a href="index.html" class="buttons backbuttons" style="border:none; border-radius:5px; padding: 10px 20px; text-decoration: none; margin: 0;"> back </a> <!-- Back Button -->
            </div> <!-- End of Bottom Left -->

            <div style="display: flex; justify-content: center; gap: 15px;"> <!-- Start of Bottom Middle -->
                <a href="textbooks.html" class="buttons btn-textbooks" style="border:none; border-radius:5px; padding: 10px 20px; text-decoration: none; margin: 0; font-weight: bold;">Textbooks</a> <!-- Textbook Tracker Button -->
                <a href="rewrite.html" class="buttons btn-rewrites" style="border:none; border-radius:5px; padding: 10px 20px; text-decoration: none; margin: 0; font-weight: bold;">Rewrites</a> <!-- Rewrite Tests Button -->
                <a href="archive.html" class="buttons btn-archive" style="border:none; border-radius:5px; padding: 10px 20px; text-decoration: none; margin: 0; font-weight: bold;">Archived Classes</a> <!-- Archived Classes Button -->
            </div> <!-- End of Bottom Middle -->

            <div style="display: flex; justify-content: flex-end; align-items: center; gap: 10px;"> <!-- Start of Location for Darkmode Toggle -->
                <span class="darkmode-label">Dark Mode</span> <!-- Darkmode Label -->
                <label class="switch"> <!-- Start of Darkmode Toggle -->
                    <input type="checkbox" id="theme-toggle"> <!-- Creates Toffle -->
                    <span class="slider round"></span> <!-- Makes it Circle Toggle -->
                </label> <!-- End of Darkmode Toggle -->
            </div> <!-- End of Location for Darkmode Toggle -->
        </div> <!-- End of Bottom Row -->

    </div> <!-- End of Portal for select.html -->

    <script src="script.js"></script> <!-- Links to script.js File -->
    <script src="keyboardNav.js"></script> <!-- Links to keyboardNav.js File -->

</body> <!-- End of Body -->

</html> <!-- End of HTML -->
